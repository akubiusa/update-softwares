name: CI for Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Install packages with fallback to available versions
          while IFS= read -r package || [[ -n "$package" ]]; do
            if [[ ! "$package" =~ ^[[:space:]]*$ ]] && [[ ! "$package" =~ ^# ]]; then
              echo "Installing $package"
              sudo apt-get install -y "$package" || {
                package_name=${package%=*}
                echo "Version specific install failed, trying $package_name without version"
                sudo apt-get install -y "$package_name"
              }
            fi
          done < .devcontainer/apt-packages.txt
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run tests
        run: |
          python3 --version
          python3 -m pytest tests/
        env:
          PYTHONPATH: .

  check-finished:
    name: Check finished CI for Linux
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
    permissions:
      actions: read

    steps:
      - name: Check build failure
        run: |
          echo "Build status: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
